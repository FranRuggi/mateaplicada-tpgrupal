services:
  - type: web
    name: mateaplicada-dh-salas
    runtime: python
    plan: free
    branch: FranFran
    buildCommand: pip install -r servidor/requirements.txt
    startCommand: python -m uvicorn servidor.app:app --host 0.0.0.0 --port $PORT --workers 1 --ws-max-size 32768
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
